---
# =============================================================================
# ALU Graduates Empowerment Platform - Ansible Deployment Playbook
# Configures VM, installs Docker, logs into ECR, deploys app
# =============================================================================

- name: Deploy ALU Platform to Production
  hosts: app_servers
  become: true
  vars:
    app_dir: /opt/alu-platform
    aws_region: "{{ lookup('env', 'AWS_REGION') | default('eu-west-1') }}"
    ecr_registry: "{{ lookup('env', 'ECR_REGISTRY') }}"
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest') }}"

  tasks:

    # ==========================================================================
    # System Setup
    # ==========================================================================
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - git
          - ufw
          - fail2ban
          - unzip
        state: present

    # ==========================================================================
    # AWS CLI Installation (for ECR login)
    # ==========================================================================
    - name: Download AWS CLI
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip

    - name: Unzip AWS CLI
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp/
        remote_src: yes

    - name: Install AWS CLI
      command: /tmp/aws/install --update
      args:
        creates: /usr/local/bin/aws

    # ==========================================================================
    # Docker Installation
    # ==========================================================================
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Install Docker Compose
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    # ==========================================================================
    # Application Setup
    # ==========================================================================
    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy docker-compose file
      template:
        src: templates/docker-compose.prod.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Copy environment file
      template:
        src: templates/.env.j2
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    # ==========================================================================
    # ECR Login and Image Deployment
    # ==========================================================================
    - name: Login to ECR
      shell: |
        aws ecr get-login-password --region {{ aws_region }} | \
        docker login --username AWS --password-stdin {{ ecr_registry }}
      become_user: ubuntu
      environment:
        AWS_ACCESS_KEY_ID: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
        AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"

    - name: Pull latest Docker image from ECR
      shell: docker pull {{ ecr_registry }}/alu-platform-backend:{{ image_tag }}
      become_user: ubuntu

    - name: Deploy application with docker-compose
      shell: docker-compose up -d --remove-orphans
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu

    # ==========================================================================
    # Security Hardening
    # ==========================================================================
    - name: Configure UFW - deny all incoming
      ufw:
        default: deny
        direction: incoming

    - name: UFW - allow SSH
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: UFW - allow HTTP
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: UFW - allow HTTPS
      ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: UFW - allow backend API
      ufw:
        rule: allow
        port: '5000'
        proto: tcp

    - name: Enable UFW
      ufw:
        state: enabled

    - name: Harden SSH - disable root login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^PermitRootLogin'
        line: 'PermitRootLogin no'

    - name: Harden SSH - disable password auth
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^PasswordAuthentication'
        line: 'PasswordAuthentication no'

    - name: Restart SSH
      systemd:
        name: sshd
        state: restarted

    - name: Enable fail2ban
      systemd:
        name: fail2ban
        state: started
        enabled: yes

    # ==========================================================================
    # Health Check
    # ==========================================================================
    - name: Wait for application to be healthy
      uri:
        url: "http://localhost:5000/api/health"
        status_code: 200
      register: health
      retries: 15
      delay: 10
      until: health.status == 200

    - name: Deployment success
      debug:
        msg: "Deployment complete! Health: {{ health.json }}"
