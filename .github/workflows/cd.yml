name: Deploy to Production

# Triggers ONLY on merge to main
on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-west-1        # (whatever it already is)
  ECR_REPOSITORY: alu-platform-backend
  ECR_REPOSITORY_FRONTEND: alu-platform-frontend

jobs:
  # ---- Run all CI checks first ----
  ci-checks:
    name: Run CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Test
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci
          MONGO_URI: mongodb://localhost:27017/test

  # ---- Security Scans ----
  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: ci-checks
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning
        run: docker build -t alu-platform-backend:scan ./backend
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: alu-platform-backend:scan
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
      - name: tfsec IaC scan
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform
          soft_fail: true

  # ---- Build and Push to ECR ----
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: [ci-checks, security-scan]
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      ecr-registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set image tag
        id: meta
        run: echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT
      - name: Build and push backend to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
      - name: Build and push frontend to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_FRONTEND }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_FRONTEND }}:latest

  # ---- Deploy via Ansible ----
  deploy:
    name: Deploy via Ansible
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/alu-platform-key.pem
          chmod 600 ~/.ssh/alu-platform-key.pem
          ssh-keyscan -H ${{ secrets.BASTION_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          
      - name: Update Ansible inventory with real IPs
        run: |
          sed -i 's/BASTION_IP/${{ secrets.BASTION_IP }}/g' ansible/inventory.ini
          sed -i 's/APP_VM_PRIVATE_IP/${{ secrets.APP_VM_PRIVATE_IP }}/g' ansible/inventory.ini

      - name: Run Ansible deployment playbook
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr-registry }}
          IMAGE_TAG: ${{ github.sha }}
          CLIENT_URL: "http://${{ secrets.BASTION_IP }}"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}

      - name: Configure bastion reverse proxy
        env:
          APP_VM_PRIVATE_IP: ${{ secrets.APP_VM_PRIVATE_IP }}
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/bastion-proxy.yml

      - name: Verify deployment
        run: |
          sleep 15
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << EOF
          Host bastion
            HostName ${{ secrets.BASTION_IP }}
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null

          Host app_server
            HostName ${{ secrets.APP_VM_PRIVATE_IP }}
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            ProxyJump bastion
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config
          ssh app_server "curl -f http://localhost:5000/api/health" || exit 1
          ssh app_server "curl -f http://localhost:3000" || exit 1
      - name: Deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Deployment successful! App: http://${{ secrets.BASTION_IP }}/"
          else
            echo "Deployment failed!"
          fi